[package]
name = "shepherd-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
home = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
