<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shepherd</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="9" y1="5" x2="9" y2="19"/>
      <line x1="15" y1="5" x2="15" y2="19"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 5.5 18 12 7 18.5z"/>
    </symbol>
    <symbol id="i-stop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/>
    </symbol>
    <symbol id="i-plug" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 7V3.5M15 7V3.5"/><path d="M7 7h10v4a5 5 0 0 1-10 0V7z"/><path d="M12 16v4.5"/>
    </symbol>
    <symbol id="i-plug-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 7V3.5M15 7V3.5"/><path d="M7 7h10v4a5 5 0 0 1-10 0V7z"/><path d="M12 16v4.5"/><path d="M3.5 3.5l17 17"/>
    </symbol>
    <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
    </symbol>
    <symbol id="i-bell-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      <path d="M18.63 13A17.9 17.9 0 0 1 18 8"/>
      <path d="M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14"/>
      <path d="M18 8a6 6 0 0 0-9.33-5"/>
      <line x1="1" y1="1" x2="23" y2="23"/>
    </symbol>
    <symbol id="i-check-c" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </symbol>
    <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"/>
    </symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/>
      <polyline points="12 19 5 12 12 5"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </symbol>
    <symbol id="i-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>
    </symbol>
    <symbol id="i-power" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    </symbol>
  </defs>
</svg>

<main id="panel" class="panel" aria-label="Shepherd agent control panel">
  <div class="panel-head">
    <div class="od-row head-row">
      <h1 class="brand">Shepherd</h1>
      <span class="head-tag">agent control</span>
      <span class="head-spacer od-fill" aria-hidden="true"></span>
      <button id="hooksBtn" class="icon-btn" type="button" aria-label="Connect Claude Code hooks" aria-pressed="false" title="Claude Code hooks">
        <svg><use href="#i-plug"/></svg>
      </button>
      <button id="muteBtn" class="icon-btn" type="button" aria-label="Mute notifications" aria-pressed="false">
        <svg><use href="#i-bell"/></svg>
      </button>
      <button id="loginBtn" class="icon-btn" type="button" aria-label="Start Shepherd at login" aria-pressed="false" title="Start at login">
        <svg><use href="#i-power"/></svg>
      </button>
      <button id="updateBtn" class="icon-btn" type="button" aria-label="Check for Shepherd updates" title="Check for updates">
        <svg><use href="#i-refresh"/></svg>
      </button>
    </div>
    <p id="summaryLine" class="summary"></p>
    <p id="noticeLine" class="notice" hidden></p>
  </div>
  <div class="tabs" role="tablist" aria-label="Panel sections">
    <button class="tab" role="tab" id="tab-inbox" type="button" aria-selected="true">Inbox <span class="count" id="c-inbox">0</span></button>
    <button class="tab" role="tab" id="tab-sessions" type="button" aria-selected="false" tabindex="-1">Sessions <span class="count" id="c-sessions">0</span></button>
    <button class="tab" role="tab" id="tab-runs" type="button" aria-selected="false" tabindex="-1">Runs <span class="count" id="c-runs">0</span></button>
  </div>
  <div id="view" class="view" role="tabpanel" aria-labelledby="tab-inbox" tabindex="0"></div>
</main>

<script type="module" src="dist/panel.js"></script>
</body>
</html>
